<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>    
    <script src="/vq/vqPlayer/js/resize.js"></script>
    <style>
        .screen{
            background-color: blue;
            border-radius: 1rem;
            color: red;
            font-size: 10rem;

        }
        #stage{
            width: 30%;
            position: absolute;
        }
        #box{
            width: 10%;
            height: 20%;
            position: absolute;
            left: 50%;
            top: 0;
            font-size: 5rem;
            background-color: green;
            transform: translateX(-50%);
        }
    </style>    
</head>
<body>
    <div>
        <div class="screen" id="stage">
            <div id="box">
                helloo
            </div>
        </div>
    </div>
</body>
</html>
